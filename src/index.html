<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <title>مركز أسيد لتحفيظ القرآن الكريم</title>
    <script>
      // تطبيق السمة الفاخرة المحفوظة قبل إقلاع Angular (لتفادي وميض الألوان)
      try {
        var THEMES = [
          'snowgold',
          'pearlobsidian',
          'platinumtitan',
          'ivorybronze',
          'obsidianroyal',
          'charcoalsilver',
          'espressobronze',
          'cybergold',
          'desertgold',
          'emeraldroyal',
        ];
        var t = localStorage.getItem('assid-center:theme');
        if (THEMES.indexOf(t) < 0) t = 'ivorybronze';
        var r = document.documentElement;
        r.setAttribute('data-app-theme', t);
        r.setAttribute('data-app-surface', 'full');
        r.setAttribute('data-app-frame', 'luxury');
      } catch (e) {}
    </script>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#0f6b3f" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&family=Amiri+Quran&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>

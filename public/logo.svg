<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 132 128" role="img"
     aria-label="شعار جمعية المحافظة على القرآن الكريم — مركز أسيد">
  <defs>
    <linearGradient id="ac-gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f8cd54"/>
      <stop offset="0.5" stop-color="#e0980f"/>
      <stop offset="1" stop-color="#b6740a"/>
    </linearGradient>
    <linearGradient id="ac-goldframe" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbe08f"/>
      <stop offset="0.5" stop-color="#dd9a1c"/>
      <stop offset="1" stop-color="#a86c08"/>
    </linearGradient>
    <linearGradient id="ac-inner" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eef4e6"/>
      <stop offset="1" stop-color="#cfe3c4"/>
    </linearGradient>
    <linearGradient id="ac-green" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#37a95c"/>
      <stop offset="1" stop-color="#0e5726"/>
    </linearGradient>
    <radialGradient id="ac-sun" cx="0.5" cy="0.42" r="0.62">
      <stop offset="0" stop-color="#fff59a"/>
      <stop offset="0.7" stop-color="#f6cf4f"/>
      <stop offset="1" stop-color="#e0a52c"/>
    </radialGradient>
    <path id="ac-ribbon" d="M14 92 Q66 118 118 92"/>
  </defs>

  <!-- الأشعّة -->
  <g stroke="#e7a92c" stroke-width="2.6" stroke-linecap="round">
    <g transform="rotate(-98 66 58)"><line x1="66" y1="30" x2="66" y2="14"/></g>
    <g transform="rotate(-82 66 58)"><line x1="66" y1="30" x2="66" y2="13"/></g>
    <g transform="rotate(-66 66 58)"><line x1="66" y1="30" x2="66" y2="12"/></g>
    <g transform="rotate(-50 66 58)"><line x1="66" y1="30" x2="66" y2="12"/></g>
    <g transform="rotate(-34 66 58)"><line x1="66" y1="30" x2="66" y2="11"/></g>
    <g transform="rotate(-18 66 58)"><line x1="66" y1="30" x2="66" y2="11"/></g>
    <g transform="rotate(0 66 58)"><line x1="66" y1="30" x2="66" y2="10"/></g>
    <g transform="rotate(18 66 58)"><line x1="66" y1="30" x2="66" y2="11"/></g>
    <g transform="rotate(34 66 58)"><line x1="66" y1="30" x2="66" y2="11"/></g>
    <g transform="rotate(50 66 58)"><line x1="66" y1="30" x2="66" y2="12"/></g>
    <g transform="rotate(66 66 58)"><line x1="66" y1="30" x2="66" y2="12"/></g>
    <g transform="rotate(82 66 58)"><line x1="66" y1="30" x2="66" y2="13"/></g>
    <g transform="rotate(98 66 58)"><line x1="66" y1="30" x2="66" y2="14"/></g>
  </g>

  <!-- إطار القوس (المحراب) -->
  <path d="M32 108 L32 54 Q32 39 44 29 Q55 20 66 20 Q77 20 88 29 Q100 39 100 54 L100 108 Z"
        fill="url(#ac-goldframe)" stroke="#9c6606" stroke-width="1.6"/>
  <!-- فتحة القوس الداخلية -->
  <path d="M41 104 L41 55 Q41 43 50 36 Q57 30 66 30 Q75 30 82 36 Q91 43 91 55 L91 104 Z"
        fill="url(#ac-inner)" stroke="#c9a24a" stroke-width="1.4"/>

  <!-- الشمس -->
  <circle cx="66" cy="53" r="15.5" fill="url(#ac-sun)" stroke="#c98f28" stroke-width="1.3"/>
  <g stroke="#8a5f1c" stroke-linecap="round" fill="none">
    <circle cx="66" cy="53" r="10.5" stroke-width="0.8" opacity="0.5"/>
    <path d="M59 55 q7 -8 14 0" stroke-width="1.6"/>
    <path d="M61 49 q5 -4 10 0" stroke-width="1.2" opacity="0.7"/>
  </g>
  <circle cx="66" cy="47.5" r="1.1" fill="#8a5f1c"/>

  <!-- الكتاب المفتوح -->
  <path d="M66 82 L45 77.5 Q42 77 42 79.6 L42 92 Q42 93.8 44 94.2 L66 98.8 Z"
        fill="#e7f1de" stroke="#4a7c3f" stroke-width="1.2"/>
  <path d="M66 82 L87 77.5 Q90 77 90 79.6 L90 92 Q90 93.8 88 94.2 L66 98.8 Z"
        fill="#f1f7ea" stroke="#4a7c3f" stroke-width="1.2"/>
  <path d="M48 80.5 L62 83.4 L62 92.6 L48 89.7 Z" fill="#fdf8e6"/>
  <path d="M84 80.5 L70 83.4 L70 92.6 L84 89.7 Z" fill="#fffdf2"/>
  <line x1="66" y1="82" x2="66" y2="98.8" stroke="#4a7c3f" stroke-width="1.2"/>
  <g stroke="#b9c9a0" stroke-width="0.8">
    <path d="M50 83 L60 85"/><path d="M50 86 L60 88"/><path d="M50 89 L60 91"/>
    <path d="M72 85 L82 83"/><path d="M72 88 L82 86"/><path d="M72 91 L82 89"/>
  </g>

  <!-- التاريخ -->
  <text x="66" y="106" text-anchor="middle" direction="rtl"
        font-family="'Tajawal',sans-serif" font-size="6.5" font-weight="700" fill="#8a2b1e">
    ١٤١١هـ ‑ ١٩٩١م
  </text>

  <!-- الشريط الأخضر -->
  <path d="M8 90 Q6 104 15 108 L34 100 L22 86 Z" fill="#0b451e"/>
  <path d="M124 90 Q126 104 117 108 L98 100 L110 86 Z" fill="#0b451e"/>
  <path d="M16 86 Q66 114 116 86 L110 102 Q66 126 22 102 Z"
        fill="url(#ac-green)" stroke="#0b451e" stroke-width="1"/>
  <text text-anchor="middle" direction="rtl"
        font-family="'Amiri Quran','Tajawal',serif" font-weight="700"
        font-size="7.4" fill="#f6dd93">
    <textPath href="#ac-ribbon" startOffset="50%">جمعية المحافظة على القرآن الكريم</textPath>
  </text>
</svg>
